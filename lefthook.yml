pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    # 文書とコメントの言い回し (scripts/wording/rules.ts)
    wording-check:
      run: node scripts/wording/check.ts {staged_files}
    # Markdown の改行のルール (整形は pnpm md:format)
    md-check:
      glob: "*.md"
      run: node scripts/markdown/check.ts {staged_files}
    # コードのコメントは 1 文 1 行 (1 行に複数の文があるコメントを検出する)
    comments-check:
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,css,sh,yml,yaml}"
      run: node scripts/comments/check.ts {staged_files}
    # シークレットの混入 (ルールは scripts/secrets/rules.ts)
    secrets-check:
      run: node scripts/secrets/check.ts {staged_files}
    scan:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm exec ast-grep scan {staged_files}

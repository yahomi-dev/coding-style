id: no-branching-in-callback
language: TypeScript
severity: error
message: インラインコールバック内で分岐しない
note: |-
  判定は filter に、変換は map に分離する。
  分岐が必要なら名前付き関数に抽出して参照で渡す。
  変換して初めて成否が判る場合は `items.map(parse).filter(isDefined)`（filterMap）を使う。
rule:
  all:
    - kind: arrow_function
    - inside:
        kind: arguments
    - has:
        stopBy:
          kind: arrow_function
        any:
          - kind: if_statement
          - kind: switch_statement
---

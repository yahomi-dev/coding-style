id: no-class
language: TypeScript
severity: error
message: class は使用しない（type でデータを、関数で振る舞いを定義する）
note: |-
  依存性の注入は関数を引数で受け取ることで実現する。
  フレームワークが class を強制する場合のみ、前行に
  `// ast-grep-ignore: no-class` と理由を書いて除外する。
rule:
  any:
    - kind: class_declaration
    - kind: class
    - kind: abstract_class_declaration
---
id: no-class-tsx
language: Tsx
severity: error
message: class は使用しない（type でデータを、関数で振る舞いを定義する）
rule:
  any:
    - kind: class_declaration
    - kind: class
    - kind: abstract_class_declaration

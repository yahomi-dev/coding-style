id: no-function-keyword
language: TypeScript
severity: error
message: function 宣言 / function 式 / ジェネレータ / メソッド定義は使用しない（アロー関数で統一）
note: |-
  オブジェクトのメソッドは `key: () => { ... }` のプロパティとして書く。
  遅延列が欲しい場面はジェネレータではなく Iterator helpers（.values() 起点）で代替する。
rule:
  any:
    - kind: function_declaration
    - kind: function_expression
    - kind: generator_function_declaration
    - kind: generator_function
    - all:
        - kind: method_definition
        - not:
            inside:
              kind: class_body
---
id: no-function-keyword-tsx
language: Tsx
severity: error
message: function 宣言 / function 式 / ジェネレータ / メソッド定義は使用しない（アロー関数で統一）
rule:
  any:
    - kind: function_declaration
    - kind: function_expression
    - kind: generator_function_declaration
    - kind: generator_function
    - all:
        - kind: method_definition
        - not:
            inside:
              kind: class_body

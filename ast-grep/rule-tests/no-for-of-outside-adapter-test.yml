id: no-for-of-outside-adapter
valid:
  - |
    const doubled = items.map((n) => n * 2);
  # for-in はこのルールの対象外（no-loops が検出する）
  - |
    for (const key in obj) {
      handle(key);
    }
invalid:
  - |
    for (const item of items) {
      await send(item);
    }
  - |
    for await (const chunk of stream) {
      handle(chunk);
    }
